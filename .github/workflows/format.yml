name: Code Formatting Check and Deploy

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format:
    runs-on: ubuntu-latest
    
    steps:
      # Скачать код репозитория
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Установить Node.js 20 с кэшированием npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      # Чистая установка зависимостей
      - name: Install dependencies JavaScript
        run: npm ci
      
      # Проверить форматирование всех файлов
      - name: Check formatting with Prettier JavaScript
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,json}" --config ./config_data/.prettierrc

  deploy:
    runs-on: ubuntu-latest
    needs: format  # После успешного format
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Только push в main (после слияния PR)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Cd
      - name: Run deploy
        run: ./cd.py